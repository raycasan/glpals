# Codemagic build configuration.
#
# The point of this file is the iOS side: there is no Mac here, so the iPhone
# build has to happen on Codemagic's macOS machines. Three workflows:
#
#   android            APK, runs anywhere, no Apple account needed.
#   ios-unsigned       Proves the app compiles for iOS. No Apple account
#                      needed, but the result cannot be installed on a phone.
#   ios-testflight     The easy way onto someone else's iPhone: upload to
#                      TestFlight and invite them by email. No UDIDs to
#                      collect, and updates arrive by themselves.
#   ios-adhoc          An .ipa installed by cable or link, for iPhones whose
#                      UDIDs are registered. Useful when TestFlight review
#                      would be in the way.
#
# Both iOS distribution workflows need the Apple Developer Program membership
# and an App Store Connect API key added to Codemagic.
#
# Flutter is pinned to the version this project is developed against, so a
# stable-channel bump cannot break a build without us choosing it.

definitions:
  flutter_version: &flutter_version 3.47.2

  base_scripts:
    - &pub_get
      name: Fetch packages
      script: flutter pub get
    - &analyze
      name: Analyze
      script: flutter analyze
    - &unit_tests
      name: Unit tests
      script: flutter test

workflows:
  # ---------------------------------------------------------------- Android
  android:
    name: Android debug APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: *flutter_version
      java: 17
    scripts:
      - *pub_get
      - *analyze
      - *unit_tests
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        # Replace with the address that should receive builds.
        recipients:
          - you@example.com
        notify:
          success: true
          failure: true

  # ----------------------------------------------------------- iOS, no cert
  # Run this one first. It answers "does GLPals build for iOS at all?" without
  # any Apple paperwork. The .app it produces runs only in a simulator.
  ios-unsigned:
    name: iOS build (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
    scripts:
      - *pub_get
      - *analyze
      - *unit_tests
      - name: Build iOS without signing
        script: flutter build ios --debug --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - you@example.com
        notify:
          success: true
          failure: true

  # ----------------------------------------------------------- iOS, TestFlight
  # The recommended route for testing on a phone you do not hold. Requires the
  # app to exist in App Store Connect with a matching bundle id; create it once
  # under My Apps, then invite the tester by email.
  #
  # Signing is fetched from Apple on every build, and the distribution
  # certificate and App Store profile are created there if they do not exist
  # yet, so nothing has to be uploaded to Codemagic by hand. The one secret it
  # needs is CERTIFICATE_PRIVATE_KEY (an RSA key; Codemagic can generate one)
  # in the "appstore" environment group, so every build signs with the same
  # certificate instead of minting a new one.
  ios-testflight:
    name: iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Name of the App Store Connect API key added under Teams > Integrations.
      # It also supplies the APP_STORE_CONNECT_* variables the signing tools use.
      app_store_connect: codemagic
    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.glpbuddy.glpBuddy"
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profiles to the Xcode project
        # Also writes the export options plist the IPA build reads below.
        script: xcode-project use-profiles
      - *pub_get
      - *analyze
      - *unit_tests
      - name: Build the IPA
        script: |
          # Codemagic keeps a build counter per project; Apple needs each
          # upload to carry a higher one than the last.
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Add the tester to this group in App Store Connect first.
        beta_groups:
          - Family
      email:
        recipients:
          - you@example.com
        notify:
          success: true
          failure: true

  # ------------------------------------------------------- iOS, installable
  # Produces an .ipa that can be installed on iPhones whose UDIDs are in the
  # ad-hoc provisioning profile.
  #
  # Before this works, in Codemagic:
  #   1. Add an App Store Connect API key under Teams > Integrations.
  #   2. Put these in an environment group called "appstore":
  #        APP_STORE_CONNECT_ISSUER_ID
  #        APP_STORE_CONNECT_KEY_IDENTIFIER
  #        APP_STORE_CONNECT_PRIVATE_KEY
  #        CERTIFICATE_PRIVATE_KEY        (an RSA key; Codemagic can generate one)
  #   3. Register each test iPhone's UDID in the Apple Developer portal.
  ios-adhoc:
    name: iOS ad-hoc IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.glpbuddy.glpBuddy"
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profiles to the Xcode project
        script: xcode-project use-profiles
      - *pub_get
      - *analyze
      - *unit_tests
      - name: Build the IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - you@example.com
        notify:
          success: true
          failure: true
